name: Android Release

on:
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release (ex: android-v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GO_VERSION: "1.26.2"
      CLOUDFLARED_VERSION: "2026.6.0"
      NODE_VERSION: "22"
      PNPM_VERSION: "9"
      ANDROID_PLATFORM: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_NDK_VERSION: "28.2.13676358"
      # Pinned (not @latest) so an upstream gomobile change can't silently
      # break this build — bump deliberately alongside go.mod's Go version.
      GOMOBILE_VERSION: "v0.0.0-20260611195102-4dd8f1dbf5d2"
      APK_NAME: preto-android.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build-tools and NDK
        run: |
          sdkmanager --install \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialize gomobile
        run: gomobile init

      - name: Build cloudflared for Android (native, cgo DNS)
        run: |
          git clone --depth 1 --branch "${CLOUDFLARED_VERSION}" \
            https://github.com/cloudflare/cloudflared.git "$RUNNER_TEMP/cloudflared"
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          build() { # abi goarch cc [goarm]
            local abi="$1" goarch="$2" cc="$3" goarm="${4:-}"
            local out="$GITHUB_WORKSPACE/mobile/android/app/src/main/jniLibs/$abi"
            mkdir -p "$out"
            ( cd "$RUNNER_TEMP/cloudflared" && \
              GOOS=android GOARCH="$goarch" GOARM="$goarm" CGO_ENABLED=1 \
              CC="$BIN/$cc" \
              go build -trimpath -o "$out/libcloudflared.so" ./cmd/cloudflared )
          }
          build arm64-v8a   arm64 aarch64-linux-android24-clang
          build armeabi-v7a arm   armv7a-linux-androideabi24-clang 7
          build x86_64      amd64 x86_64-linux-android24-clang

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # `make aar` builda o frontend (target frontend-build) antes do bind,
      # garantindo que o embed nunca empacota um dist obsoleto.
      - name: Build AAR
        run: make aar

      - name: Copy AAR into Android project
        run: cp build/preto.aar mobile/android/app/libs/preto.aar

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      # Release builds are signed with the keystore from secrets when present
      # (RELEASE_KEYSTORE_BASE64 + companion passwords/alias). Without those
      # secrets configured, the build falls back to the debug keystore — see
      # app/build.gradle — so the workflow still produces an installable APK.
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build Android APK
        working-directory: mobile/android
        run: chmod +x ./gradlew && ./gradlew assembleRelease

      - name: Stage APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/${APK_NAME}"

      - name: Resolve release tag
        id: release_tag
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ runner.temp }}/${{ env.APK_NAME }}
          generate_release_notes: true
